# Build a bundle and publish it to prodman; a human deploys it from the prodman UI.
name: Bundle and publish (review in prodman)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0 # full history for the changelog
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm
      - id: bundle
        uses: westonpark/pmx_release/actions/bundle@v1
        with:
          env: ${{ secrets.APP_ENV }} # optional: shipped encrypted
          env-key: ${{ secrets.PMX_BUNDLE_KEY }}
      - uses: westonpark/pmx_release/actions/publish@v1
        with:
          file: ${{ steps.bundle.outputs.file }}
          prodman-url: ${{ vars.PRODMAN_URL }}
          bucket: ${{ vars.PRODMAN_BUCKET }}
          token: ${{ secrets.PRODMAN_TOKEN }} # pdb_ token: capabilities release, read
