# Python project managed by uv. The bundle config chooses how dependencies travel:
#   deps: { mode: "install" }  the server runs `uv sync --frozen` (hosts of mixed architectures)
#   deps: { mode: "vendor" }   the .venv is built here, so run on a runner of the servers' platform
#                              (for example ubuntu-24.04-arm for arm64 hosts)
name: Bundle and publish (Python, uv)
on:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: bundle-${{ github.ref }}
  cancel-in-progress: false
jobs:
  bundle:
    runs-on: ubuntu-24.04 # ubuntu-24.04-arm for vendor mode on arm64 hosts
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
      - id: bundle
        uses: westonpark/pmx_release/actions/bundle@v1
      - uses: westonpark/pmx_release/actions/publish@v1
        with:
          file: ${{ steps.bundle.outputs.file }}
          prodman-url: ${{ vars.PRODMAN_URL }}
          bucket: ${{ vars.PRODMAN_BUCKET }}
          token: ${{ secrets.PRODMAN_TOKEN }}
